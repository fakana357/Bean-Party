<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bean Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root {
  /* Bean Party: candy pastel world, chunky rounded type, thick ink outlines */
  --ink: #2a1846;
  --pink: #ff5fa8;
  --sky: #7fd3ff;
  --sun: #ffd23f;
  --mint: #4fe3b5;
  --paper: #fff7fb;
  --display: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Nunito', 'Arial Rounded MT Bold', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #8fd8ff; font-family: var(--body); color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
.layer { position: fixed; inset: 0; pointer-events: none; }
.layer > * { pointer-events: auto; }
button { font-family: var(--display); color: var(--ink); cursor: pointer; border: 4px solid var(--ink); border-radius: 18px; background: #fff; box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.hidden { display: none !important; }

/* ---------- title */
#menu { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px; padding-top: max(18px, env(safe-area-inset-top)); }
.logo { font-family: var(--display); font-size: clamp(64px, 14vw, 150px); line-height: .9; letter-spacing: 1px; text-align: center; color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink); display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .25em; }
.logo span { display: inline-block; animation: wob 2.4s ease-in-out infinite; }
.logo .w2 span { color: var(--sun); }
.logo span:nth-child(odd) { animation-delay: -.6s; }
.logo span:nth-child(3n) { animation-delay: -1.2s; }
@keyframes wob { 0%,100% { transform: translateY(0) rotate(-3deg) scale(1,1); } 50% { transform: translateY(-10px) rotate(3deg) scale(1.04,.96); } }
.card { background: var(--paper); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink); padding: 18px 20px; width: min(440px, 100%); display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.label { font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50% 50% 46% 46%; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); padding: 0; }
.sw.on { transform: translateY(-3px) scale(1.12); outline: 3px solid #fff; }
.stepper { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 26px; }
.stepper button { width: 44px; height: 44px; font-size: 24px; border-radius: 14px; padding: 0; }
input[type=text] { font-family: var(--display); font-size: 22px; border: 4px solid var(--ink); border-radius: 14px; padding: 6px 12px; width: 170px; color: var(--ink); background: #fff; }
.play { font-size: 40px; padding: 10px 46px; background: var(--sun); border-radius: 24px; }
.ctrl { font-size: 14px; font-weight: 800; text-align: center; opacity: .85; }
kbd { font-family: var(--body); font-weight: 900; background: #fff; border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 8px; padding: 0 6px; }

/* ---------- hud */
#hud { font-family: var(--display); }
.chip { position: absolute; background: #fff; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); padding: 6px 14px; font-size: 22px; }
#round { top: max(12px, env(safe-area-inset-top)); left: 12px; }
#timer { top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 28px; min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }
#timer.warn { background: #ff5f6d; color: #fff; }
#board { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; display: grid; gap: 6px; width: 190px; }
.pl { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 3px 10px 3px 6px; font-size: 18px; box-shadow: 0 3px 0 var(--ink); transition: transform .3s; }
.pl .dot { width: 22px; height: 24px; border-radius: 50% 50% 45% 45%; border: 3px solid var(--ink); }
.pl .nm { font-family: var(--body); font-weight: 900; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .sc { font-variant-numeric: tabular-nums; }
.pl.me { background: #fff2b8; }
.pl.out { opacity: .5; }
.pl.done .nm::after { content: ' ✓'; }
.pl .gain { color: #16a36b; font-size: 15px; margin-left: 4px; }
#lights { position: absolute; left: 12px; top: 72px; display: flex; flex-direction: column; gap: 6px; background: var(--ink); border-radius: 18px; padding: 8px; }
#lights i { width: 30px; height: 30px; border-radius: 50%; background: #4a3a63; display: block; }
#lights i.on.r { background: #ff4d5e; box-shadow: 0 0 18px #ff4d5e; }
#lights i.on.y { background: #ffd23f; box-shadow: 0 0 18px #ffd23f; }
#lights i.on.g { background: #57e36b; box-shadow: 0 0 18px #57e36b; }
#clock { position: absolute; left: 62px; top: 76px; font-size: 18px; }
#unusedBtn { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); font-size: 24px; padding: 12px 22px; }
#stopBtn { left: 16px; background: #ff8fb8; }
#abilBtn { left: 150px; background: var(--sky); }
#abilBtn.armed { background: var(--sun); }

/* ---------- banners */
#banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: min(92vw, 760px); }
#banner h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(44px, 9vw, 96px); line-height: 1; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); text-wrap: balance; }
#banner p { margin: 14px auto 0; font-family: var(--display); font-size: clamp(20px, 3.6vw, 30px); background: #fff; display: inline-block; border: 4px solid var(--ink); border-radius: 16px; padding: 4px 16px; box-shadow: 0 5px 0 var(--ink); }
#banner .hint { display: block; width: fit-content; margin: 12px auto 0; font-family: var(--body); font-weight: 900; font-size: 17px; background: var(--sun); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 12px; box-shadow: 0 4px 0 var(--ink); }
#banner.pop { animation: pop .55s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.3) rotate(-8deg); opacity: 0; } to { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } }
#toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); font-family: var(--display); font-size: 26px; background: #fff; border: 4px solid var(--ink); border-radius: 16px; padding: 6px 18px; box-shadow: 0 5px 0 var(--ink); white-space: nowrap; transition: opacity .3s, transform .3s; }
#toast.off { opacity: 0; transform: translateX(-50%) translateY(20px); }
#fade { position: fixed; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; transition: opacity 1s; }

/* ---------- end */
#end { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 16px; padding: 24px; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
#end h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 8vw, 80px); margin: 0; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); text-align: center; }
#standings { display: grid; gap: 6px; width: min(360px, 100%); }

/* ---------- dev console */
#dev { position: fixed; right: 12px; bottom: 12px; width: 340px; max-height: 80vh; overflow: auto; background: #1d1233ee; color: #f4eaff; border: 3px solid #000; border-radius: 14px; padding: 12px; font: 600 13px/1.4 ui-monospace, Menlo, monospace; pointer-events: auto; display: grid; gap: 8px; z-index: 10; }
#dev h3 { margin: 0; font: 900 14px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--sun); }
#dev button { font: 800 13px var(--body); color: #fff; background: #3b2763; border: 2px solid #000; border-radius: 8px; box-shadow: 0 3px 0 #000; padding: 5px 8px; text-align: left; }
#dev .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#dev .orig { opacity: .6; font-weight: 600; display: block; font-size: 11px; }
#dev .games { display: grid; gap: 4px; }
#dev .gRow { display: grid; grid-template-columns: 34px 1fr; gap: 4px; }
#dev .gRow input { grid-column: 2; font: 600 12px var(--body); border-radius: 6px; border: 2px solid #000; padding: 2px 6px; background: #2a1c44; color: #f4eaff; }
#dev .mark { text-align: center; padding: 2px; font-size: 16px; }
#dev textarea { width: 100%; height: 140px; font: 600 11px ui-monospace, monospace; border-radius: 8px; }
#dev select { font: 700 13px var(--body); border-radius: 8px; padding: 3px; }
#devToggle { position: fixed; right: 12px; bottom: 12px; font: 900 14px ui-monospace, monospace; padding: 6px 10px; border-radius: 12px; z-index: 9; opacity: .8; pointer-events: auto; }
@media (max-width: 640px) {
  #board { width: 150px; }
  .pl { font-size: 15px; grid-template-columns: 20px 1fr auto; }
  .pl .dot { width: 18px; height: 20px; }
  .pl .nm { font-size: 12px; }
  .chip { font-size: 18px; }
}

/* ---------- show presentation */
.stars-bg { background-color: var(--pink); background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 3px, transparent 4px), radial-gradient(circle at 70% 60%, rgba(255,255,255,.25) 0 2px, transparent 3px), linear-gradient(135deg, #ff5fa8 0%, #b05cff 100%); background-size: 46px 46px, 31px 31px, 100% 100%; }
#menu { justify-content: space-between; padding-bottom: max(18px, env(safe-area-inset-bottom)); background: none; }
.menuBottom { display: flex; gap: 18px; align-items: flex-end; justify-content: center; flex-wrap: wrap; width: min(980px, 100%); }
.custom { width: min(520px, 100%); gap: 8px; }
.custom .sub { font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin-top: 4px; }
.side { display: grid; gap: 14px; justify-items: center; }
.card.mini { width: auto; display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
.pat { width: 40px; height: 40px; border-radius: 50% 50% 46% 46%; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); padding: 0; background-size: cover; }
.pat.on, .acc.on { transform: translateY(-3px) scale(1.12); outline: 3px solid var(--sun); }
.emojis { max-height: 150px; overflow-y: auto; padding: 4px; }
.custom { max-height: 82vh; overflow-y: auto; }
.emo { width: 40px; height: 40px; font-size: 24px; padding: 0; border-radius: 12px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); line-height: 1; }
.emo.on { transform: translateY(-3px) scale(1.12); outline: 3px solid var(--sun); }
.acc { width: 30px; height: 30px; border-radius: 9px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); padding: 0; }
.card { background: linear-gradient(180deg, #fff 0%, #fff4fa 100%); }
.play { background: linear-gradient(180deg, #ffe36b 0%, #ffc21f 100%); font-size: 46px; padding: 8px 54px; transform: rotate(-2deg); }
.play:hover { transform: rotate(-2deg) scale(1.04); }
#round { background: linear-gradient(180deg, #ff7fc0, #ff4fa0); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; transform: rotate(-2deg); text-transform: uppercase; letter-spacing: .03em; }
#banner .ribbon { display: inline-block; padding: 10px 34px 14px; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 9px 0 var(--ink); transform: rotate(-2deg); }
#banner .ribbon { background-color: #b05cff; background-image: radial-gradient(circle, rgba(255,255,255,.28) 0 3px, transparent 4px), linear-gradient(135deg, #ff5fa8, #b05cff); background-size: 34px 34px, 100% 100%; }
#banner h1 { -webkit-text-stroke: 7px var(--ink); }
#stamp { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
#stamp .st { text-align: center; padding: 14px 44px 18px; border: 6px solid var(--ink); border-radius: 30px; box-shadow: 0 10px 0 var(--ink); transform: rotate(-6deg); background: linear-gradient(135deg, #ff5fa8, #ff8a3d); }
#stamp.good .st { background: linear-gradient(135deg, #57d96b, #2ee6c5); }
#stamp.gold .st { background: linear-gradient(135deg, #ffe36b, #ff9f1f); }
#stamp.meh .st { background: linear-gradient(135deg, #a066ff, #6b5bb0); }
#stamp b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(56px, 12vw, 130px); line-height: 1; color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); }
#stamp small { display: block; font-family: var(--display); font-size: clamp(22px, 4vw, 36px); color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
#stamp.go { animation: slam .5s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes slam { from { transform: scale(2.6) rotate(10deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
#roulette { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background-color: #7a3cff; background-image: radial-gradient(circle, rgba(255,255,255,.22) 0 3px, transparent 4px), radial-gradient(circle at 30% 30%, rgba(255,255,255,.15) 0 2px, transparent 3px), linear-gradient(160deg, #ff5fa8 0%, #9a4dff 55%, #3d8bff 100%); background-size: 40px 40px, 23px 23px, 100% 100%; pointer-events: auto; }
.rhead span { display: inline-block; font-family: var(--display); font-size: clamp(40px, 8vw, 84px); color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); transform: rotate(-3deg); }
.rwin { position: relative; width: 100%; height: 230px; overflow: hidden; }
.rstrip { position: absolute; left: 0; top: 10px; display: flex; gap: 22px; will-change: transform; }
.rcard { flex: none; width: 200px; height: 200px; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink); background: #fff; overflow: hidden; display: flex; flex-direction: column; }
.rcard img { width: 100%; flex: 1; object-fit: cover; display: block; min-height: 0; }
.rcard span { font-family: var(--display); font-size: 17px; text-align: center; padding: 4px 6px 6px; border-top: 4px solid var(--ink); background: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rpick { position: absolute; left: 50%; top: 0; bottom: 0; width: 220px; transform: translateX(-50%); border: 6px solid #fff; border-radius: 32px; box-shadow: 0 0 0 5px var(--ink), 0 0 40px rgba(255,255,255,.8); pointer-events: none; }
.rname { font-family: var(--display); font-size: clamp(30px, 6vw, 58px); color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); min-height: 1.2em; }
.rname.go { animation: pop2 .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop2 { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#mid { display: grid; place-items: center; }
.midcard { width: min(420px, 92vw); border: 5px solid var(--ink); border-radius: 28px; box-shadow: 0 10px 0 var(--ink); padding: 16px; display: grid; gap: 8px; background-color: #b05cff; background-image: radial-gradient(circle, rgba(255,255,255,.22) 0 3px, transparent 4px), linear-gradient(160deg, #ff5fa8, #9a4dff); background-size: 36px 36px, 100% 100%; animation: pop2 .45s cubic-bezier(.2,1.6,.4,1) both; }
.midhead { font-family: var(--display); font-size: 40px; text-align: center; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
#midRows { display: grid; gap: 6px; }
#midRows .pl { font-size: 22px; }
#fade { background: radial-gradient(circle at 50% 40%, #6b3cbf, #2a1846); }
.pl .dot { background-size: cover !important; }
@media (max-width: 640px) { .rcard { width: 150px; height: 150px; } .rpick { width: 168px; } .rwin { height: 180px; } .play { font-size: 36px; } .menuBottom { gap: 10px; } }


/* ---------- menu v2 */
#menu { display: block; }
.logo.small { position: absolute; left: 28px; top: max(30px, env(safe-area-inset-top)); font-size: clamp(48px, 8vw, 96px); justify-content: flex-start; }
.tag3d { position: absolute; transform: translate(-50%, -100%); font-family: var(--body); font-weight: 900; font-size: 13px; color: #fff; -webkit-text-stroke: 3.5px var(--ink); paint-order: stroke fill; white-space: nowrap; pointer-events: none; }
.tag3d.me { color: var(--sun); font-size: 15px; }
#tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.nameTag { position: absolute; left: 38%; top: 74%; transform: translate(-50%, 0) rotate(-2deg); font-family: var(--display); font-size: 30px; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); pointer-events: none; }
.menuRight { position: absolute; right: max(24px, 5vw); bottom: max(28px, env(safe-area-inset-bottom)); display: grid; gap: 14px; justify-items: stretch; width: min(340px, 86vw); }
.menuRight .play { font-size: 64px; padding: 6px 0 10px; }
.btn2 { font-size: 26px; padding: 8px 18px; background: linear-gradient(180deg, #8fe3ff, #4fbfff); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.menuRight .card.mini { justify-content: space-between; }
.menuRight .ctrl { color: #fff; text-shadow: 0 2px 0 var(--ink); }
.custom { position: absolute; left: max(18px, 3vw); bottom: max(24px, env(safe-area-inset-bottom)); width: min(460px, 92vw); }
/* ---------- hud v2 */
#hint { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(760px, 94vw); text-align: center; font-family: var(--body); font-weight: 900; font-size: 17px; background: rgba(255,255,255,.94); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 7px 16px; text-wrap: balance; }
#hint .goal { font-size: 15px; color: #7a2bd6; margin-bottom: 2px; }
#hint.hot { background: var(--sun); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }
#countdown { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(120px, 26vw, 260px); color: #fff; -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; text-shadow: 0 14px 0 var(--ink); pointer-events: none; }
#countdown.go { color: var(--sun); }
#countdown.tick { animation: cd .9s ease-out both; }
@keyframes cd { 0% { transform: scale(2.2); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 80% { transform: scale(.9); opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
#joy { position: absolute; left: 22px; bottom: max(70px, env(safe-area-inset-bottom)); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.35); border: 4px solid rgba(42,24,70,.6); touch-action: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: #fff; border: 4px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
#actBtn { position: absolute; right: 22px; bottom: max(80px, env(safe-area-inset-bottom)); width: 110px; height: 110px; border-radius: 50%; font-size: 22px; background: linear-gradient(180deg, #ffe36b, #ffc21f); }
#banner.flyover { top: 22%; }

/* ---------- online */
.menuRight .play.online { background: var(--pink); color: #fff; -webkit-text-stroke: 0; text-shadow: 0 3px 0 var(--ink); font-size: 60px; line-height: .95; padding: 12px 0 16px; }
.menuRight #play { font-size: 34px; padding: 4px 0 8px; }
#net, #pause { display: grid; place-items: center; background: rgba(42,24,70,.35); }
.netcard { width: min(520px, 94vw); max-height: 88vh; overflow: auto; }
.netform { display: grid; gap: 10px; border-top: 3px dashed rgba(42,24,70,.25); padding-top: 14px; }
.netform input, #passInput { width: 100%; font-size: 20px; }
.btn2.small, .play.small { font-size: 18px; padding: 6px 14px; border-radius: 14px; }
#roomList { display: grid; gap: 8px; }
#roomList button { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 20px; padding: 10px 14px; text-align: left; }
#roomList button[disabled] { opacity: .5; cursor: default; }
#roomList .meta { font-family: var(--body); font-weight: 900; font-size: 14px; white-space: nowrap; }
#roomList .none { text-align: center; font-weight: 800; opacity: .7; padding: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { font-size: 18px; padding: 6px 0; border-radius: 14px; }
.seg button.on { background: var(--sun); transform: translateY(-2px); }
.seg.ro button { pointer-events: none; }
#roomPlayers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pl { display: flex; align-items: center; gap: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 10px; font-family: var(--display); font-size: 18px; }
.pl i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--ink); font-size: 18px; flex: none; }
.pl small { font-family: var(--body); font-weight: 900; font-size: 11px; opacity: .6; margin-left: auto; }
.neterr { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: #ff4d6d; color: #fff; font-weight: 900; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 16px; box-shadow: 0 4px 0 var(--ink); }
.pausecard { width: min(340px, 90vw); }
#skipBtn { position: absolute; left: max(14px, 2vw); top: max(70px, calc(env(safe-area-inset-top) + 56px)); font-size: 16px; padding: 6px 12px; border-radius: 14px; }
#skipBtn.voted { background: var(--sun); }

@media (prefers-reduced-motion: reduce) { .logo span { animation: none; } #banner.pop { animation: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="menu" class="layer">
  <div class="logo small" aria-label="Bean Party"><span class="w1"><span>B</span><span>e</span><span>a</span><span>n</span></span><span class="w2"><span>P</span><span>a</span><span>r</span><span>t</span><span>y</span></span></div>
  <div class="menuRight">
    <button class="play online" id="online">PLAY ONLINE</button>
    <button class="play" id="play">PLAY</button>
    <button class="btn2" id="custBtn">Customize</button>
    <div class="card mini"><span class="label">Beans</span><div class="stepper"><button id="minus" aria-label="Fewer beans">−</button><span id="count">8</span><button id="plus" aria-label="More beans">+</button></div></div>
    <div class="ctrl"><kbd>WASD</kbd> move · <kbd>Click</kbd> a bean / <kbd>Space</kbd> = action</div>
  </div>
  <div class="card custom hidden" id="custom">
    <div class="row"><span class="label">Name</span><input type="text" id="name" maxlength="12" value="You"></div>
    <div class="sub">Face</div><div class="swatches emojis" id="emojis"></div>
    <div class="sub">Pattern</div><div class="swatches" id="patterns"></div>
    <div class="sub">Main colour</div><div class="swatches" id="mainCols"></div>
    <div class="sub">Second colour</div><div class="swatches" id="subCols"></div>
    <button class="btn2" id="custDone">Done</button>
  </div>
</div>

<div id="hud" class="layer hidden">
  <div class="chip" id="round">Game 1 of 5</div>
  <div class="chip hidden" id="timer">90</div>
  <div id="board"></div>
  <div id="lights" class="hidden"><i class="r"></i><i class="y"></i><i class="g"></i></div>
  <div class="chip hidden" id="clock">01:00</div>
  <div id="banner" class="hidden"><div class="ribbon"><h1></h1></div><p></p><span class="hint hidden"></span></div>
  <div id="stamp" class="hidden"><div class="st"><b></b><small></small></div></div>
  <div id="toast" class="off"></div>
  <div id="hint" class="hidden"></div>
  <div id="countdown" class="hidden"></div>
  <div id="joy" class="hidden"><div id="joyKnob"></div></div>
  <button id="actBtn" class="hidden">Action</button>
  <button id="skipBtn" class="hidden">Vote to skip</button>
</div>

<div id="end" class="layer hidden">
  <h1 id="endTitle">Winner!</h1>
  <div id="standings"></div>
  <button class="play" id="again">Play again</button>
</div>

<div id="net" class="layer hidden">
  <div class="card netcard" id="netRooms">
    <div class="row"><span class="label">Rooms</span><button class="btn2 small" id="netBack">Back</button></div>
    <div id="roomList"></div>
    <div class="netform">
      <input type="text" id="roomName" maxlength="24" placeholder="Room name">
      <input type="text" id="roomPass" maxlength="24" placeholder="Password (optional)">
      <div class="seg" id="newGames"><button data-n="8" class="on">8 games</button><button data-n="20">20</button><button data-n="52">All</button></div>
      <button class="play" id="roomCreate">Create room</button>
    </div>
  </div>
  <div class="card netcard hidden" id="netRoom">
    <div class="row"><span class="label" id="roomTitle">Room</span><button class="btn2 small" id="roomLeave">Leave</button></div>
    <div id="roomPlayers"></div>
    <div class="seg" id="roomGames"><button data-n="8">8 games</button><button data-n="20">20</button><button data-n="52">All</button></div>
    <button class="play" id="roomStart">Start</button>
    <div class="ctrl" id="roomWait">Waiting for the host…</div>
  </div>
  <div class="card netcard hidden" id="netPass">
    <span class="label" id="passTitle">Password</span>
    <input type="text" id="passInput" maxlength="24" placeholder="Password">
    <div class="row"><button class="btn2" id="passCancel">Cancel</button><button class="play small" id="passOk">Join</button></div>
  </div>
  <div class="neterr hidden" id="netErr"></div>
</div>
<div id="pause" class="layer hidden"><div class="card pausecard"><button class="btn2" id="pauseResume">Resume</button><button class="play" id="pauseQuit">Disconnect</button></div></div>

<div id="fade"></div>
<div id="roulette" class="layer hidden"><div class="rhead"><span id="rRound">Round 1</span></div><div class="rwin"><div class="rstrip" id="rStrip"></div><div class="rpick"></div></div><div class="rname" id="rName"></div></div>
<div id="mid" class="layer hidden"><div class="midcard"><div class="midhead" id="midHead">Standings</div><div id="midRows"></div></div></div>
<button id="devToggle" title="Developer console (`)">&lt;/&gt;</button>
<div id="dev" class="hidden"></div>

<script type="module" src="js/client/main.js"></script>
</body>
</html>
